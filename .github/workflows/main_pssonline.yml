# STAGED — the Azure App Service resource (pssonline) doesn't exist yet, so
# there's no publish profile to put in AZUREAPPSERVICE_PUBLISHPROFILE_PSSONLINE
# and this workflow has nothing to deploy to. Written now, matching i-CHARM's
# live reference shape (see [[PHP Migration Playbook]]'s "Azure App Service"
# section), so there's zero extra pipeline work once the App Service exists.
#
# This replaces the retired Container Apps / Bicep pipeline
# (infra/main.bicep, .github/workflows/deploy-azure.yml, the old GitHub CLI
# Deployment Runbook) per the 2026-08-20 org-wide decision: Docker/Container
# Apps are retired everywhere, Azure App Service (Linux, native PHP runtime,
# OneDeploy) is the only deploy target now.
#
# Once the App Service exists (created via Azure Portal's Deployment Center,
# which is what actually generates/names a workflow file like this one, or via
# `az webapp create` + wiring up the publish profile secret by hand):
#   1. Confirm app-name below matches the real resource name.
#   2. Confirm the AZUREAPPSERVICE_PUBLISHPROFILE_PSSONLINE secret is set
#      (Portal: Deployment Center > Manage publish profile > download, then
#      `gh secret set AZUREAPPSERVICE_PUBLISHPROFILE_PSSONLINE --repo <repo> < profile.xml`).
#   3. Push to main (or run workflow_dispatch) and watch it with
#      `gh run watch --repo <repo> --exit-status`.
#   4. Verify what actually landed via Kudu VFS
#      (https://pssonline.scm.azurewebsites.net/api/vfs/site/wwwroot/.user.ini)
#      before trusting a green "Succeeded" run — a missing include-hidden-files
#      flag on the upload step below silently drops dotfiles even on a
#      "successful" deploy. It's set correctly here; just don't remove it.

name: Build and deploy PHP app to Azure Web App - pssonline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .
          # CRITICAL: without this, actions/upload-artifact@v4 silently drops
          # every dotfile (.user.ini, .env.example, .gitignore, ...) - the
          # deploy still shows "Succeeded", the file is sitting right there in
          # the GitHub repo, but it never reaches /home/site/wwwroot. Hit
          # twice already (i-CHARM, i-proc) - see [[PHP Migration Playbook]].
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pssonline'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PSSONLINE }}
          package: .

# --- After every deploy, verify - don't trust the green checkmark ------------
#   curl -I https://pssonline.scm.azurewebsites.net/api/vfs/site/wwwroot/.user.ini
#   (needs Kudu Basic Auth / Azure CLI token - see PHP Migration Playbook)
#   A 200 confirms .user.ini actually landed. A 404 means it didn't, even if
#   this workflow's summary says "Succeeded".
