; PSS_Online — Azure App Service (Linux, native PHP runtime / OneDeploy) PHP tuning.
;
; App Service's PHP-FPM reads .user.ini from the docroot automatically — no portal
; config, no startup script needed. This mirrors docker/php.ini-overrides.ini (used
; for local Docker dev only, per the 2026-08-20 org-wide decision to deploy via
; Azure App Service, not Docker/Container Apps — see [[PHP Migration Playbook]]).
; Keep the two files in sync by hand; there's no single source of truth between them.
;
; This app handles Excel (PHPExcel) and PDF (TCPDF/FPDF) generation plus file
; uploads (BOM/master data imports), which need more headroom than PHP's defaults.

upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Match the DB charset used by include/config.php
default_charset = "UTF-8"
date.timezone = "Asia/Kuala_Lumpur"

; Production-safe error handling: log, don't display, to avoid leaking paths/queries.
display_errors = Off
log_errors = On
error_reporting = E_ALL
; (display_errors is Off above, so this only affects what gets logged)

; This app relies on session_start() in many files (822 of them); keep sessions
; on disk under App Service's per-instance ephemeral /tmp.
session.save_path = "/tmp"

; CRITICAL — this is the exact bug this playbook entry exists to prevent:
; index.php (and others) print HTML output *before* calling session_start() /
; header("Location: ...") later in the request (e.g. once ckies-aut_scd.php is
; included after the <!DOCTYPE html> line). Without output buffering, this turns
; into a silent "login POST returns 200 but shows a blank page" failure — the
; PHP-FPM log shows "Cannot modify header information - headers already sent"
; and "session_start(): Session cannot be started after headers have already
; been sent". Confirmed twice already on sibling projects (i-CHARM, i-proc) —
; see [[PHP Migration Playbook]]'s "Azure App Service" section.
output_buffering = 4096
