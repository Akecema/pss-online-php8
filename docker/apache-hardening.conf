# Baked into the image (Dockerfile: a2enconf app-hardening). Patterns, not a list
# of names, so new dotfiles / tooling folders are covered automatically.
# Nothing below is reachable over HTTP; PHP still includes these files from disk.

# Dotfiles and dot-directories anywhere (.env, .git/, .htpasswd, .user.ini ...),
# except .well-known which is a public convention.
<LocationMatch "/\.(?!well-known/)">
    Require all denied
</LocationMatch>

# Non-web folders at the site root: shared PHP, dev tooling, tests, deploy files.
<LocationMatch "^/(_tools|tests|docker|infra|include|docs|db|jobs|vendor)(/|$)">
    Require all denied
</LocationMatch>

# Deployment / project files sitting in the web root.
<LocationMatch "^/(Dockerfile|docker-compose\.ya?ml|[^/]*\.(md|pem|sql|py|ps1|ini|log|example)|composer\.(json|lock))$">
    Require all denied
</LocationMatch>

# Upload / data folders hold user-supplied files: never execute scripts from them.
<LocationMatch "(?i)^/(BOM_upload|BOM_update|BOM_detail_upload|BOM_detail_update|set_upload|upload_master_MRIN|FromPortal[0-9]*|ToIPOS|planning/upload_pps[^/]*)/.*\.(php[0-9]?|phtml|phar|pht)$">
    Require all denied
</LocationMatch>
# No auto-generated folder listings.
<Directory /var/www/>
    Options -Indexes
</Directory>

# Never advertise versions.
ServerTokens Prod
ServerSignature Off

# ---- Security headers ----------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header unset X-Powered-By

    # CSP: the pages rely on inline <script> blocks and on* handlers (578 / 384 files), so
    # 'unsafe-inline' has to stay for scripts. What it still enforces: nobody can frame the site,
    # no plugins, base/form targets stay on this origin, and only the CDNs the pages already use
    # can serve scripts, styles and fonts.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://unpkg.com https://cdn.datatables.net https://ajax.googleapis.com https://maxcdn.bootstrapcdn.com https://use.fontawesome.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com https://use.fontawesome.com https://cdn.datatables.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com https://use.fontawesome.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"

    # The PSSboard display screens still use MooTools 1.2, which calls eval() internally; allow that for this
    # folder only. Every other page keeps the stricter policy above.
    <LocationMatch "^/PSSboard/">
        Header always edit Content-Security-Policy "script-src 'self' 'unsafe-inline'" "script-src 'self' 'unsafe-inline' 'unsafe-eval'"
    </LocationMatch>

    # Cookie flags on every Set-Cookie that lacks them (PHP's session cookie already has HttpOnly and
    # SameSite from php.ini; the app's own cookies do not). PHP's headers sit in the "onsuccess"
    # table, so the edits are applied to both tables.
    Header edit Set-Cookie "^((?!.*;\s*HttpOnly).*)$" "$1; HttpOnly"
    Header always edit Set-Cookie "^((?!.*;\s*HttpOnly).*)$" "$1; HttpOnly"
    Header edit Set-Cookie "^((?!.*;\s*SameSite).*)$" "$1; SameSite=Lax"
    Header always edit Set-Cookie "^((?!.*;\s*SameSite).*)$" "$1; SameSite=Lax"

    # Only when the browser reached us over HTTPS (directly, or through Azure's proxy).
    <If "%{HTTPS} == 'on' || %{HTTP:X-Forwarded-Proto} == 'https'">
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header edit Set-Cookie "^((?!.*;\s*Secure).*)$" "$1; Secure"
        Header always edit Set-Cookie "^((?!.*;\s*Secure).*)$" "$1; Secure"
    </If>
</IfModule>

# /page.php/anything used to run page.php with the extra text in $_SERVER['PHP_SELF'], and 500+ pages
# echo PHP_SELF into form actions and links: a reflected-XSS hole. With this off such URLs are 404.
AcceptPathInfo Off
