# nginx equivalent of docker/apache-hardening.conf, for Azure App Service (Linux, PHP, nginx).
# startup.sh includes this file inside the default server block, ahead of the PHP location, so the
# deny rules below win. Nothing here is reachable over HTTP; PHP still include()s these files from disk.

# Dotfiles and dot-directories anywhere (.env, .git/, .user.ini ...), except .well-known.
location ~ /\.(?!well-known/) { return 404; }

# Non-web folders at the site root: shared PHP, dev tooling, tests, deploy files.
location ~ ^/(_tools|tests|docker|infra|include|docs|db|jobs|vendor)(/|$) { return 404; }

# Deployment / project files sitting in the web root.
location ~ ^/(Dockerfile|docker-compose\.ya?ml|startup\.sh|[^/]*\.(md|pem|sql|py|ps1|ini|log|example)|composer\.(json|lock))$ { return 404; }

# Upload / data folders hold user-supplied files: never execute scripts from them.
location ~* ^/(BOM_upload|BOM_update|BOM_detail_upload|BOM_detail_update|set_upload|upload_master_MRIN|FromPortal[0-9]*|ToIPOS|planning/upload_pps[^/]*)/.*\.(php[0-9]?|phtml|phar|pht)$ { return 404; }

# /page.php/anything ran page.php with the extra text in PHP_SELF (reflected XSS): make such URLs 404.
location ~ \.php/ { return 404; }

autoindex off;
server_tokens off;

# ---- Security headers (same values as the Apache file) ----
# The PSSboard display screens use MooTools 1.2, which calls eval(); allow it for that folder only.
set $csp_eval "";
if ($uri ~ ^/PSSboard/) { set $csp_eval " 'unsafe-eval'"; }

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'$csp_eval https://code.jquery.com https://unpkg.com https://cdn.datatables.net https://ajax.googleapis.com https://maxcdn.bootstrapcdn.com https://use.fontawesome.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com https://use.fontawesome.com https://cdn.datatables.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com https://use.fontawesome.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;