; PSS_Online runtime tuning - this app handles Excel (PHPExcel) and PDF (TCPDF/FPDF)
; generation plus file uploads (BOM/master data imports), which need more headroom
; than PHP's defaults.

upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Match the DB charset used by include/config.php
default_charset = "UTF-8"
date.timezone = "Asia/Kuala_Lumpur"

; Production-safe error handling: log, don't display, to avoid leaking paths/queries.
display_errors = Off
log_errors = On
error_reporting = E_ALL
; (display_errors is Off above, so this only affects what gets logged)

; This app relies on register_globals-era-adjacent session usage in many files
; (822 files call session_start()); keep sessions on disk inside the container.
session.save_path = "/tmp"

; index.php (and others) print HTML output *before* calling session_start() /
; header("Location: ...") later in the request (e.g. once ckies-aut_scd.php is
; included after the <!DOCTYPE html> line). On shared/cPanel hosting this app was
; built for, output_buffering is on by default, which masks the bug. The stock
; PHP Docker image ships it off, which turns it into a silent "login does nothing"
; failure (session cookie and post-login redirect both fail once body output has
; started). This is the exact same bug pattern found in a sibling project's
; Docker deployment - fixed proactively here rather than after the fact.
output_buffering = 4096

; --- Session cookie hardening --------------------------------------------------------
; HttpOnly keeps the session id away from page scripts; SameSite=Lax stops it being sent on
; cross-site POSTs; strict mode refuses session ids the server did not create (fixation).
; The Secure flag is added by Apache (docker/apache-hardening.conf) when the request came in
; over HTTPS - it cannot be set here without breaking plain-http local development.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
expose_php = Off
