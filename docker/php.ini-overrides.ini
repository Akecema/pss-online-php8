; PSS_Online runtime tuning - this app handles Excel (PHPExcel) and PDF (TCPDF/FPDF)
; generation plus file uploads (BOM/master data imports), which need more headroom
; than PHP's defaults.

upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Match the DB charset used by include/config.php
default_charset = "UTF-8"
date.timezone = "Asia/Kuala_Lumpur"

; Production-safe error handling: log, don't display, to avoid leaking paths/queries.
display_errors = Off
log_errors = On
error_reporting = E_ALL
; (display_errors is Off above, so this only affects what gets logged)

; This app relies on register_globals-era-adjacent session usage in many files
; (822 files call session_start()); keep sessions on disk inside the container.
session.save_path = "/tmp"
